<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="把 800 个 GRE 核心词，一张一张变熟悉。随机词卡、自测与个人学习记录。" />
    <title>词间 · GRE 800</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="words.js" defer></script>
    <script src="logic.js" defer></script>
    <script src="lexicon.js" defer></script>
    <script src="progress.js" defer></script>
    <script src="views.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app">跳转到学习内容</a>
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#" aria-label="词间 GRE 800 首页">
        <span class="brand-mark" aria-hidden="true">词<span>·</span></span>
        <span class="brand-copy"><strong>词间</strong><span>GRE 800</span></span>
      </a>
      <div class="sidebar-caption">每天一点，慢慢熟悉。</div>
      <div class="nav-caption">我的学习</div>
      <nav class="nav-list" aria-label="学习模式">
        <button type="button" class="nav-item" data-nav="self-check"><span class="nav-symbol" aria-hidden="true">✓</span><span>自认模式</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button type="button" class="nav-item" data-nav="special-review"><span class="nav-symbol" aria-hidden="true">☆</span><span>特殊待复习</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button type="button" class="nav-item active" data-nav="basic" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 5.5h6.2c.8 0 1.3.3 1.3 1.2v12.8c0-.9-.6-1.3-1.5-1.3h-6V5.5Zm15 0h-6.2c-.8 0-1.3.3-1.3 1.2v12.8c0-.9.6-1.3 1.5-1.3h6V5.5Z"/><path d="M7 9h2.5M7 12h2.5M14.5 9H17M14.5 12H17"/></svg>
          <span>基础模式</span><span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="nav-item" data-nav="test">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4.5H5.5v15h13v-15H15M9 3.5h6v3H9zM8 11h4M8 15h3M14 14l1.4 1.5L18 12"/></svg>
          <span>测试模式</span><span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="nav-item" data-nav="progress">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 4.5v15h15M8 15v-4M12 15V7M16 15v-7"/></svg>
          <span>学习分析</span><span class="nav-dot" aria-hidden="true"></span>
        </button>
        <button type="button" class="nav-item" data-nav="recall"><span class="nav-symbol" aria-hidden="true">↔</span><span>反向回忆</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button type="button" class="nav-item" data-nav="synonyms"><span class="nav-symbol" aria-hidden="true">≈</span><span>同义词训练</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button type="button" class="nav-item" data-nav="quality"><span class="nav-symbol" aria-hidden="true">◎</span><span>词库校核</span><span class="nav-dot" aria-hidden="true"></span></button>
        <button type="button" class="nav-item" data-nav="exam"><span class="nav-symbol" aria-hidden="true">▤</span><span>GRE 题型</span><span class="nav-dot" aria-hidden="true"></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-progress">
          <div class="sidebar-progress-heading"><span>词库探索</span><span id="side-progress">0 / 800</span></div>
          <div class="sidebar-progress-track" aria-hidden="true"><span id="side-progress-bar" style="width:0%"></span></div>
          <p>已掌握 <strong id="side-mastered">0</strong> 个单词</p>
        </div>
        <div class="sidebar-note"><span class="sidebar-note-icon" aria-hidden="true">✳</span><p>A little every day.<br /><span>让积累，成为你的底气。</span></p></div>
        <footer class="sidebar-footer"><span class="status-dot" aria-hidden="true"></span><span id="storage-status">学习进度保存在此浏览器</span></footer>
      </div>
    </aside>
    <main id="app" class="app-main" tabindex="-1">
      <header class="page-header"><div><p class="eyebrow">YOUR DAILY WORD PRACTICE</p><h1 class="page-title">让每个单词，都更熟悉一点。</h1><p class="page-description">正在准备你的 GRE 800 词卡…</p></div></header>
      <div class="empty-state" role="status"><span class="loading-dot" aria-hidden="true"></span><p>正在翻开词库</p></div>
      <noscript><p class="feedback neutral">请开启浏览器的 JavaScript，以使用词卡和测试功能。</p></noscript>
    </main>
  </body>
</html>
